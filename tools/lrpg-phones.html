<!doctype html>
<!-- Layout for the Life RPG picture of three phones with the game on them and two of its heroes in front.
     tools/make-lrpg-phones.sh opens it in headless Chrome: ?card=1 is the shop card's version and ?og=1 the sharing
     picture's, both on a dark background. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .stage { position: relative; width: 1400px; height: 880px; overflow: hidden; }
  .group { position: absolute; left: 0; top: 0; width: 1400px; height: 880px; transform-origin: 0 0; }
  .phone { position: absolute; width: 330px; height: 567px; border-radius: 48px; background: #0d0f16; padding: 13px; box-sizing: border-box;
    box-shadow: 0 0 0 2px #3a3f52, 0 30px 60px rgba(0, 0, 0, .45), inset 0 0 0 2px #22262f; transform-origin: 50% 100%; }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 36px; }
  .phone::before { content: ''; position: absolute; top: 21px; left: 50%; width: 13px; height: 13px; margin-left: -6px; border-radius: 50%; background: #0d0f16; box-shadow: 0 0 0 2px #1d2130; z-index: 1; }
  .left { left: 255px; top: 205px; transform: rotate(-10deg); }
  .mid { left: 535px; top: 95px; z-index: 2; }
  .right { left: 815px; top: 205px; transform: rotate(10deg); }
  .hero { position: absolute; bottom: 18px; height: 380px; z-index: 3; filter: drop-shadow(0 18px 18px rgba(0, 0, 0, .35)); }
  .hero.a { left: 70px; }
  .hero.b { right: 70px; transform: scaleX(-1); }
  .title { display: none; }
  .card .stage, .og .stage { background: radial-gradient(ellipse at 60% 45%, #3a4a8c 0%, #1f2a55 55%, #141a38 100%); }
  .card .stage { width: 1600px; height: 900px; }
  .card .group { left: 100px; top: 10px; }
  .og .stage { width: 1200px; height: 630px; }
  .og .group { left: 430px; top: 75px; transform: scale(.55); }
  .og .title { display: block; position: absolute; left: 64px; top: 180px; width: 430px; color: #fff; font: 28px/1.4 system-ui, sans-serif; }
  .og .title b { display: block; margin-bottom: 18px; color: #e8b75a; font: bold 92px/1 Georgia, serif; }
</style>
<div class="stage">
  <div class="title"><b>Life RPG</b>Turn real-life goals into quests. Level up and grow your own city.</div>
  <div class="group">
    <div class="phone left"><img src="../public/assets/life-rpg/hero.webp" alt=""></div>
    <div class="phone mid"><img src="../public/assets/life-rpg/today.webp" alt=""></div>
    <div class="phone right"><img src="../public/assets/life-rpg/city-roman.webp" alt=""></div>
    <img class="hero a" src="../public/assets/life-rpg/heroes/h06_casual.webp" alt="">
    <img class="hero b" src="../public/assets/life-rpg/heroes/h09_casual.webp" alt="">
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.className = q.get('og') ? 'og' : q.get('card') ? 'card' : '';
</script>
